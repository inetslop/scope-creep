# Builds every game and deploys them to GitHub Pages every 10 minutes (only when main changed):
# Scope Creep (game/) at /scope-creep/, each projects/<id>/game/ at /<id>/, and at the root a
# front page (site/home.ts) that lists the games and what every machine of the fleet is doing.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy game to GitHub Pages

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *' # 6x/hour, off the top of the hour (GitHub drops busy-time runs)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the build log reads who built what, and when

      - name: Skip if this commit is already live
        id: live
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/version.json"
          live=$(curl -fsSL "$site" 2>/dev/null | jq -r '.sha // empty' || true)
          head=$(git rev-parse HEAD)
          echo "live=${live:-none} head=$head"
          if [ -n "$live" ] && [[ "$head" == "$live"* ]] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.live.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            game/package-lock.json
            projects/*/game/package-lock.json

      - name: Install, check and build
        if: steps.live.outputs.skip != 'true'
        run: |
          set -e
          for dir in game projects/*/game; do
            [ -f "$dir/package.json" ] || continue
            echo "::group::$dir"
            (cd "$dir" && npm ci --no-audit --no-fund && npm run check && npm run build)
            echo "::endgroup::"
          done

      # The public build logs (site/), built from runner-written records. Agents can't edit site/ or
      # this workflow. If one fails, the games still deploy, just without the page and its link.
      - name: Build log pages
        if: steps.live.outputs.skip != 'true'
        continue-on-error: true
        run: |
          # Name the project: without it, build-log.ts reads loop.project (the game being built now).
          SCOPE_CREEP_PROJECT=scope-creep node site/build-log.ts game/dist
          for dir in projects/*/game; do
            [ -d "$dir/dist" ] || continue
            SCOPE_CREEP_PROJECT="$(basename "$(dirname "$dir")")" node site/build-log.ts "$dir/dist"
          done

      - name: Put the games together
        if: steps.live.outputs.skip != 'true'
        run: |
          mkdir -p _site
          cp -r game/dist _site/scope-creep
          for dir in projects/*/game; do
            if [ -d "$dir/dist" ]; then cp -r "$dir/dist" "_site/$(basename "$(dirname "$dir")")"; fi
          done

      # Not optional like the build logs: it writes the root page and version.json, which the
      # "already live" check above reads.
      - name: Front page
        if: steps.live.outputs.skip != 'true'
        run: node site/home.ts _site

      - uses: actions/configure-pages@v6
        if: steps.live.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.live.outputs.skip != 'true'
        with:
          path: _site

      - id: deployment
        if: steps.live.outputs.skip != 'true'
        uses: actions/deploy-pages@v5
