# Builds game/ and deploys it to GitHub Pages every 10 minutes (only when main changed).
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy game to GitHub Pages

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *' # 6x/hour, off the top of the hour (GitHub drops busy-time runs)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the build log reads who built what, and when

      - name: Skip if this commit is already live
        id: live
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/version.json"
          live=$(curl -fsSL "$site" 2>/dev/null | jq -r '.sha // empty' || true)
          head=$(git rev-parse HEAD)
          echo "live=${live:-none} head=$head"
          if [ -n "$live" ] && [[ "$head" == "$live"* ]] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.live.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install, check and build
        if: steps.live.outputs.skip != 'true'
        working-directory: game
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      # The public build log (site/), built from runner-written records. Agents can't edit site/ or
      # this workflow. If it fails, the game still deploys, just without the page and its link.
      - name: Build log page
        if: steps.live.outputs.skip != 'true'
        continue-on-error: true
        run: node site/build-log.ts game/dist

      - uses: actions/configure-pages@v6
        if: steps.live.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.live.outputs.skip != 'true'
        with:
          path: game/dist

      - id: deployment
        if: steps.live.outputs.skip != 'true'
        uses: actions/deploy-pages@v5
