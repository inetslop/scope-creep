name: Deploy the leaderboard

# The Chokepoint leaderboard: a Cloudflare Worker over a D1 database (leaderboard/). Runs when
# leaderboard/ changes, or by hand. Until the repo has the two Cloudflare secrets it does nothing
# (leaderboard/README.md says how to set them up). Agents can't edit this file or leaderboard/.
on:
  push:
    branches: [main]
    paths: ['leaderboard/**', '.github/workflows/leaderboard.yml']
  workflow_dispatch:

concurrency:
  group: leaderboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: chokepoint-leaderboard
      WRANGLER: npx --yes wrangler@4
    steps:
      - name: Skip without the Cloudflare secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets yet: the leaderboard is not deployed (see leaderboard/README.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22

      - name: Find or create the database, apply its migrations
        if: steps.gate.outputs.go == 'true'
        working-directory: leaderboard
        run: |
          set -e
          find_id() {
            $WRANGLER d1 list --json | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => { const db = JSON.parse(s).find((d) => d.name === process.argv[1]); process.stdout.write(db ? db.uuid : ""); });' "$DB_NAME"
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            $WRANGLER d1 create "$DB_NAME"
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then echo "::error::could not find or create the D1 database $DB_NAME"; exit 1; fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          $WRANGLER d1 migrations apply "$DB_NAME" --remote

      - name: Deploy the Worker
        if: steps.gate.outputs.go == 'true'
        working-directory: leaderboard
        run: |
          set -e
          $WRANGLER deploy | tee deploy.log
          # A fresh salt for hashing addresses: the rate limit only needs it stable for an hour.
          openssl rand -hex 16 | $WRANGLER secret put IP_SALT
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          {
            echo "### Leaderboard deployed"
            echo ""
            echo "Worker: ${url:-see the log above}"
            echo ""
            echo "The game shows its boards once the repository variable **LEADERBOARD_URL** is set to that address and the site is deployed again."
          } >> "$GITHUB_STEP_SUMMARY"
