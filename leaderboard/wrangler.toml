# The leaderboard Worker. Deployed by .github/workflows/leaderboard.yml, which finds (or creates)
# the D1 database by name and writes its id below before deploying. See README.md.
name = "chokepoint-leaderboard"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://inetslop.github.io,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"

[[d1_databases]]
binding = "DB"
database_name = "chokepoint-leaderboard"
database_id = "992d1a40-2d30-434a-9dda-0c126ed9c552"
migrations_dir = "migrations"
